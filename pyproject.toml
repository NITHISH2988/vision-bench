[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-bench"
version = "0.2.0"
description = "Reproducible CIFAR-10 training and evaluation with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "Pillow>=9.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
